  <rect x="45" y="145" width="48" height="95" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="69" y1="145" x2="69" y2="240" stroke="#4f46e5" stroke-width="1"/>
  <line x1="45" y1="170" x2="93" y2="170" stroke="#4f46e5" stroke-width="1"/>
  <line x1="45" y1="195" x2="93" y2="195" stroke="#4f46e5" stroke-width="1"/>
  <line x1="45" y1="218" x2="93" y2="218" stroke="#4f46e5" stroke-width="1"/>
  <rect x="50" y="153" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="73" y="153" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="50" y="178" width="9" height="10" fill="#c7d2fe" opacity="0.9"/>
  <rect x="73" y="178" width="9" height="10" fill="#c7d2fe" opacity="0.9"/>
  <rect x="50" y="202" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="73" y="202" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <line x1="69" y1="145" x2="69" y2="118" stroke="#4f46e5" stroke-width="2"/>
  <line x1="62" y1="124" x2="76" y2="124" stroke="#4f46e5" stroke-width="1.5"/>

  <rect x="112" y="160" width="42" height="80" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="133" y1="160" x2="133" y2="240" stroke="#4f46e5" stroke-width="1"/>
  <line x1="112" y1="183" x2="154" y2="183" stroke="#4f46e5" stroke-width="1"/>
  <line x1="112" y1="208" x2="154" y2="208" stroke="#4f46e5" stroke-width="1"/>
  <rect x="117" y="167" width="8" height="9" fill="#a5b4fc" opacity="0.7"/>
  <rect x="137" y="167" width="8" height="9" fill="#c7d2fe" opacity="0.9"/>
  <!-- flat roof modernist top -->
  <rect x="112" y="155" width="42" height="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>

  <!-- Right buildings -->
  <rect x="435" y="158" width="45" height="82" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="457" y1="158" x2="457" y2="240" stroke="#4f46e5" stroke-width="1"/>
  <line x1="435" y1="182" x2="480" y2="182" stroke="#4f46e5" stroke-width="1"/>
  <line x1="435" y1="206" x2="480" y2="206" stroke="#4f46e5" stroke-width="1"/>
  <line x1="435" y1="226" x2="480" y2="226" stroke="#4f46e5" stroke-width="1"/>
  <rect x="440" y="163" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="462" y="163" width="9" height="10" fill="#c7d2fe" opacity="0.9"/>
  <rect x="435" y="152" width="45" height="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>

  <rect x="500" y="140" width="50" height="100" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="525" y1="140" x2="525" y2="240" stroke="#4f46e5" stroke-width="1"/>
  <line x1="500" y1="165" x2="550" y2="165" stroke="#4f46e5" stroke-width="1"/>
  <line x1="500" y1="190" x2="550" y2="190" stroke="#4f46e5" stroke-width="1"/>
  <line x1="500" y1="215" x2="550" y2="215" stroke="#4f46e5" stroke-width="1"/>
  <rect x="505" y="148" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="529" y="148" width="9" height="10" fill="#c7d2fe" opacity="0.9"/>
  <rect x="505" y="172" width="9" height="10" fill="#c7d2fe" opacity="0.9"/>
  <rect x="529" y="172" width="9" height="10" fill="#a5b4fc" opacity="0.7"/>
  <rect x="500" y="134" width="50" height="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>

  <!-- Trees (Chandigarh is known for green) -->
  <line x1="175" y1="240" x2="175" y2="212" stroke="#4f46e5" stroke-width="2"/>
  <ellipse cx="175" cy="205" rx="12" ry="10" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="158" y1="240" x2="158" y2="216" stroke="#4f46e5" stroke-width="1.5"/>
  <ellipse cx="158" cy="209" rx="10" ry="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="415" y1="240" x2="415" y2="212" stroke="#4f46e5" stroke-width="2"/>
  <ellipse cx="415" cy="205" rx="12" ry="10" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="432" y1="240" x2="432" y2="216" stroke="#4f46e5" stroke-width="1.5"/>
  <ellipse cx="432" cy="209" rx="10" ry="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>

  <line x1="0" y1="240" x2="600" y2="240" stroke="#4f46e5" stroke-width="2"/>
  <line x1="0" y1="248" x2="600" y2="248" stroke="#818cf8" stroke-width="1" stroke-dasharray="20,15"/>
  <ellipse cx="80" cy="38" rx="28" ry="11" fill="white" opacity="0.65"/>
  <ellipse cx="106" cy="34" rx="18" ry="9" fill="white" opacity="0.65"/>
  <ellipse cx="490" cy="46" rx="26" ry="10" fill="white" opacity="0.6"/>
  <text x="300" y="268" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="2">MOHALI · PUNJAB</text>
</svg>
