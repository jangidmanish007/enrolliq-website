<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#sky)"/>
  <rect x="0" y="240" width="600" height="40" fill="#c7d2fe" opacity="0.35"/>

  <!-- Capitol Complex Chandigarh / Punjab & Haryana High Court style (Le Corbusier) -->
  <!-- Main Assembly building - flat roof modernist -->
  <!-- Central hyperbolic cooling tower / Assembly funnel -->
  <path d="M255,130 Q270,90 300,85 Q330,90 345,130 L340,200 L260,200 Z" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- Tower opening at top -->
  <ellipse cx="300" cy="85" rx="28" ry="12" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <!-- Shade fin (iconic) -->
  <rect x="242" y="118" width="18" height="82" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="242,118 235,100 260,100 260,118" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="340" y="118" width="18" height="82" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="340,118 340,100 365,100 358,118" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
  <!-- Base platform -->
  <rect x="220" y="198" width="160" height="14" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <rect x="208" y="210" width="184" height="14" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <rect x="195" y="222" width="210" height="18" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <!-- Horizontal floor lines on assembly -->
  <line x1="263" y1="150" x2="337" y2="150" stroke="#4f46e5" stroke-width="1"/>
  <line x1="261" y1="165" x2="339" y2="165" stroke="#4f46e5" stroke-width="1"/>
  <line x1="261" y1="180" x2="339" y2="180" stroke="#4f46e5" stroke-width="1"/>
  <line x1="261" y1="195" x2="339" y2="195" stroke="#4f46e5" stroke-width="1"/>
  <!-- Entrance portico -->
  <rect x="282" y="190" width="36" height="42" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
  <line x1="300" y1="190" x2="300" y2="232" stroke="#4f46e5" stroke-width="1"/>
  <!-- Column fins -->
  <line x1="272" y1="130" x2="272" y2="200" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="282" y1="128" x2="282" y2="200" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="318" y1="128" x2="318" y2="200" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="328" y1="130" x2="328" y2="200" stroke="#4f46e5" stroke-width="1.2"/>
  <!-- Mast / spire at top of funnel -->
  <line x1="300" y1="74" x2="300" y2="52" stroke="#4f46e5" stroke-width="2"/>
  <line x1="293" y1="58" x2="307" y2="58" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="296" y1="52" x2="304" y2="52" stroke="#4f46e5" stroke-width="1.5"/>
  <!-- Open Hand symbol (simplified) -->
  <circle cx="300" cy="42" r="8" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="296" y1="38" x2="296" y2="32" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="300" y1="36" x2="300" y2="30" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="304" y1="38" x2="304" y2="32" stroke="#4f46e5" stroke-width="1.2"/>

