<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <rect width="160" height="120" fill="#FFFBEB"/>
  <rect x="0" y="100" width="160" height="20" fill="#FDE68A"/>
  <rect x="0" y="100" width="160" height="4" fill="#F59E0B"/>

  <!-- Kapaleeshwarar Temple Gopuram -->
  <!-- Base platform -->
  <rect x="30" y="92" width="100" height="9" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <rect x="38" y="84" width="84" height="9" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>

  <!-- Main gopuram - tiered pyramid -->
  <rect x="56" y="66" width="48" height="20" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <rect x="62" y="52" width="36" height="16" fill="#FCD34D" stroke="#B45309" stroke-width="1.5"/>
  <rect x="67" y="40" width="26" height="14" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>
  <rect x="71" y="30" width="18" height="12" fill="#FCD34D" stroke="#B45309" stroke-width="1.2"/>
  <rect x="74" y="21" width="12" height="11" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
  <rect x="76" y="14" width="8" height="9" fill="#FCD34D" stroke="#B45309" stroke-width="1"/>
  <!-- Finial -->
  <ellipse cx="80" cy="13" rx="5" ry="3" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
  <line x1="80" y1="10" x2="80" y2="4" stroke="#B45309" stroke-width="1.5"/>
  <polygon points="77,4 80,0 83,4" fill="#B45309"/>

  <!-- Decorative niches on tiers -->
  <rect x="59" y="68" width="6" height="8" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <rect x="68" y="68" width="6" height="8" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <rect x="77" y="68" width="6" height="8" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <rect x="86" y="68" width="6" height="8" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <rect x="95" y="68" width="6" height="8" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <rect x="65" y="54" width="5" height="7" rx="2.5" fill="#FCD34D" stroke="#B45309" stroke-width="0.8"/>
  <rect x="73" y="54" width="5" height="7" rx="2.5" fill="#FCD34D" stroke="#B45309" stroke-width="0.8"/>
  <rect x="81" y="54" width="5" height="7" rx="2.5" fill="#FCD34D" stroke="#B45309" stroke-width="0.8"/>
  <rect x="89" y="54" width="5" height="7" rx="2.5" fill="#FCD34D" stroke="#B45309" stroke-width="0.8"/>

  <!-- Horizontal tier lines -->
  <line x1="56" y1="76" x2="104" y2="76" stroke="#B45309" stroke-width="0.8"/>
  <line x1="62" y1="62" x2="98" y2="62" stroke="#B45309" stroke-width="0.8"/>
  <line x1="67" y1="50" x2="93" y2="50" stroke="#B45309" stroke-width="0.8"/>
  <line x1="71" y1="40" x2="89" y2="40" stroke="#B45309" stroke-width="0.8"/>

  <!-- Side shrines -->
  <rect x="30" y="76" width="22" height="17" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <polygon points="30,76 41,66 52,76" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
  <ellipse cx="41" cy="66" rx="5" ry="3" fill="#F59E0B"/>
  <rect x="108" y="76" width="22" height="17" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <polygon points="108,76 119,66 130,76" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
  <ellipse cx="119" cy="66" rx="5" ry="3" fill="#F59E0B"/>

  <!-- Main entrance arch -->
  <rect x="72" y="75" width="16" height="18" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <path d="M72,75 Q80,68 88,75" fill="#FCD34D" stroke="#B45309" stroke-width="1"/>

  <!-- Palm trees -->
  <rect x="10" y="88" width="3" height="12" fill="#92400E"/>
  <path d="M11.5,88 Q4,81 2,74" stroke="#15803D" stroke-width="2" fill="none"/>
  <path d="M11.5,88 Q19,81 21,74" stroke="#15803D" stroke-width="2" fill="none"/>
  <path d="M11.5,88 Q6,83 5,76" stroke="#15803D" stroke-width="1.5" fill="none"/>
  <path d="M11.5,88 Q17,83 18,76" stroke="#15803D" stroke-width="1.5" fill="none"/>
  <rect x="146" y="88" width="3" height="12" fill="#92400E"/>
  <path d="M147.5,88 Q140,81 138,74" stroke="#15803D" stroke-width="2" fill="none"/>
  <path d="M147.5,88 Q155,81 157,74" stroke="#15803D" stroke-width="2" fill="none"/>
  <path d="M147.5,88 Q142,83 141,76" stroke="#15803D" stroke-width="1.5" fill="none"/>
  <path d="M147.5,88 Q153,83 154,76" stroke="#15803D" stroke-width="1.5" fill="none"/>

  <ellipse cx="28" cy="16" rx="14" ry="7" fill="white" opacity="0.8"/>
  <ellipse cx="40" cy="13" rx="9" ry="6" fill="white" opacity="0.8"/>
  <ellipse cx="122" cy="20" rx="12" ry="6" fill="white" opacity="0.8"/>
</svg>
