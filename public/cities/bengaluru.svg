<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Sky -->
  <rect width="160" height="120" fill="#ECFDF5"/>
  <!-- Ground -->
  <rect x="0" y="100" width="160" height="20" fill="#A7F3D0"/>
  <rect x="0" y="100" width="160" height="4" fill="#34D399"/>

  <!-- Vidhana Soudha -->
  <!-- Base steps -->
  <rect x="20" y="95" width="120" height="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <rect x="28" y="89" width="104" height="7" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <!-- Main body -->
  <rect x="36" y="58" width="88" height="33" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <!-- Columns -->
  <rect x="40" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="50" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="60" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="70" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="80" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="90" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="100" y="58" width="5" height="33" fill="#A7F3D0"/>
  <rect x="110" y="58" width="5" height="33" fill="#A7F3D0"/>
  <!-- Arched windows between columns -->
  <path d="M45,72 L45,62 Q47.5,58 50,62 L50,72 Z" fill="#6EE7B7"/>
  <path d="M55,72 L55,62 Q57.5,58 60,62 L60,72 Z" fill="#6EE7B7"/>
  <path d="M65,72 L65,62 Q67.5,58 70,62 L70,72 Z" fill="#6EE7B7"/>
  <path d="M75,72 L75,62 Q77.5,58 80,62 L80,72 Z" fill="#6EE7B7"/>
  <path d="M85,72 L85,62 Q87.5,58 90,62 L90,72 Z" fill="#6EE7B7"/>
  <path d="M95,72 L95,62 Q97.5,58 100,62 L100,72 Z" fill="#6EE7B7"/>
  <path d="M105,72 L105,62 Q107.5,58 110,62 L110,72 Z" fill="#6EE7B7"/>
  <!-- Pediment / triangular roof -->
  <polygon points="36,58 80,36 124,58" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <!-- Side turrets -->
  <rect x="36" y="44" width="14" height="16" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
  <ellipse cx="43" cy="44" rx="7" ry="5" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>
  <rect x="110" y="44" width="14" height="16" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
  <ellipse cx="117" cy="44" rx="7" ry="5" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>
  <!-- Spire on turrets -->
  <line x1="43" y1="39" x2="43" y2="30" stroke="#059669" stroke-width="1.5"/>
  <polygon points="40,30 43,24 46,30" fill="#059669"/>
  <line x1="117" y1="39" x2="117" y2="30" stroke="#059669" stroke-width="1.5"/>
  <polygon points="114,30 117,24 120,30" fill="#059669"/>
  <!-- Central dome -->
  <ellipse cx="80" cy="36" rx="14" ry="9" fill="#6EE7B7" stroke="#059669" stroke-width="1.5"/>
  <line x1="80" y1="27" x2="80" y2="18" stroke="#059669" stroke-width="2"/>
  <polygon points="76,18 80,10 84,18" fill="#059669"/>
  <!-- Door -->
  <rect x="73" y="78" width="14" height="13" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>
  <path d="M73,78 Q80,72 87,78" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>

  <!-- Trees -->
  <rect x="10" y="86" width="3" height="14" fill="#059669"/>
  <ellipse cx="11.5" cy="83" rx="7" ry="6" fill="#34D399"/>
  <rect x="146" y="86" width="3" height="14" fill="#059669"/>
  <ellipse cx="147.5" cy="83" rx="7" ry="6" fill="#34D399"/>

  <!-- Clouds -->
  <ellipse cx="28" cy="16" rx="14" ry="7" fill="white" opacity="0.85"/>
  <ellipse cx="40" cy="13" rx="10" ry="6" fill="white" opacity="0.85"/>
  <ellipse cx="122" cy="20" rx="12" ry="6" fill="white" opacity="0.85"/>
  <ellipse cx="132" cy="17" rx="8" ry="5" fill="white" opacity="0.85"/>
</svg>
